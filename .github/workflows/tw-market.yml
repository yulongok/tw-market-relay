name: tw-market-relay

on:
  schedule:
    - cron: "40 7 * * 1-5"
    - cron: "0 3 11 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-push
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tw_market_data.py --relay data --codes codes.txt --backfill-months 24
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "market data $(date -u +%F)" || exit 0
          git pull --rebase
          git push
